name: Build Moi Dengi Android APK

on:
  push:
    branches: [main]
    paths:
      - 'rashody-android/app/**'
      - 'rashody-android/settings.gradle'
      - 'rashody-android/build.gradle'
      - 'rashody-android/gradle.properties'
      - '.github/workflows/build-moi-dengi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moi-dengi-apk-build
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon -p rashody-android :app:assembleDebug

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="rashody-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='kg.evgeny.moidengi'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "sdkVersion:'26'"
          test "$(wc -c < "$APK")" -gt 5000

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoiDengi-Android-APK
          path: rashody-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct APK download
        run: |
          set -euo pipefail
          mkdir -p rashody-android/downloads
          cp rashody-android/app/build/outputs/apk/debug/app-debug.apk rashody-android/downloads/moi-dengi.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f rashody-android/downloads/moi-dengi.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Moi Dengi APK [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
