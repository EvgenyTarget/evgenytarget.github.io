name: Build Moi Dengi Android APK

on:
  push:
    branches: [main]
    paths:
      - 'rashody-android/app/**'
      - 'rashody-android/settings.gradle'
      - 'rashody-android/build.gradle'
      - 'rashody-android/gradle.properties'
      - '.github/workflows/build-moi-dengi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moi-dengi-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("rashody-android/app/src/main/assets/index.html")
          t=p.read_text()
          assert all(x in t for x in ['nativeSheets', '__nativeSheetsReply', 'id="tab-shopping"', 'function renderShopping()'])
          assert "exp-20261110-001" not in t, "Private financial records must not ship in public APK"
          js=re.search(r"<script>([\s\S]*?)</script>",t).group(1)
          Path("/tmp/finance-web-ui.js").write_text(js)
          print("Android HTML/JS:",len(t),"bytes")
          PY
          node --check /tmp/finance-web-ui.js

      - name: Build installable APK
        run: gradle --no-daemon -p rashody-android :app:assembleDebug

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="rashody-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='kg.evgeny.moidengi'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "sdkVersion:'26'"
          test "$(wc -c < "$APK")" -gt 5000
          unzip -p "$APK" assets/index.html | grep -q 'nativeSheets'
          unzip -p "$APK" assets/index.html | grep -q 'nativeSheets'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='2.0.0'"

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoiDengi-Android-APK
          path: rashody-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct APK download
        run: |
          set -euo pipefail
          # Keep the built APK outside the working tree while checking out
          # the newest branch HEAD. This avoids binary rebase conflicts.
          cp rashody-android/app/build/outputs/apk/debug/app-debug.apk /tmp/moi-dengi.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p rashody-android/downloads
            cp /tmp/moi-dengi.apk rashody-android/downloads/moi-dengi.apk
            git add -f rashody-android/downloads/moi-dengi.apk
            if git diff --cached --quiet; then
              echo "APK is already current"
              exit 0
            fi
            git commit -m "chore: publish Moi Dengi APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not publish APK without racing other commits" >&2
          exit 1

      - name: Enable KVM for Android emulator
        run: |
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No KVM available; emulator may be slow"
          fi

      - name: Android device smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            adb install -r rashody-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n kg.evgeny.moidengi/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep 'kg.evgeny.moidengi'
            adb shell pidof kg.evgeny.moidengi
            adb shell screencap -p /sdcard/moi-dengi.png
            adb pull /sdcard/moi-dengi.png /tmp/moi-dengi-emulator.png

