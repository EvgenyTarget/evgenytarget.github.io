name: Build Moi Dengi Android APK

on:
  push:
    branches: [main]
    paths:
      - 'rashody-android/app/**'
      - 'rashody-android/settings.gradle'
      - 'rashody-android/build.gradle'
      - 'rashody-android/gradle.properties'
      - '.github/workflows/build-moi-dengi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moi-dengi-apk-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android platform and build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify orientation and security source invariants
        run: |
          grep -q 'configChanges="screenLayout|orientation|screenSize|smallestScreenSize|keyboard|keyboardHidden"' rashody-android/app/src/main/AndroidManifest.xml
          grep -q 'onConfigurationChanged' rashody-android/app/src/main/java/kg/evgeny/moidengi/MainActivity.java
          grep -q 'Content-Security-Policy' rashody-android/app/src/main/java/kg/evgeny/moidengi/MainActivity.java
          grep -q 'android:allowBackup="false"' rashody-android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' rashody-android/app/src/main/AndroidManifest.xml

      - name: Validate Android UI JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("rashody-android/app/src/main/assets/index.html")
          t=p.read_text()
          assert all(x in t for x in ['nativeSheets', '__nativeSheetsReply', 'id="tab-shopping"', 'function renderShopping()'])
          assert "exp-20261110-001" not in t, "Private financial records must not ship in public APK"
          js=re.search(r"<script>([\s\S]*?)</script>",t).group(1)
          Path("/tmp/finance-web-ui.js").write_text(js)
          print("Android HTML/JS:",len(t),"bytes")
          PY
          node --check /tmp/finance-web-ui.js

      - name: Build installable APK
        run: gradle --no-daemon -p rashody-android :app:assembleDebug

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="rashody-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='kg.evgeny.moidengi.sheets'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "sdkVersion:'26'"
          test "$(wc -c < "$APK")" -gt 5000
          unzip -p "$APK" assets/index.html | grep -q 'nativeSheets'
          unzip -p "$APK" assets/index.html | grep -q 'nativeSheets'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionName='2.1.0'"

      - name: Enable KVM for Android emulator
        run: |
          if test -e /dev/kvm; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No KVM available; emulator may be slow"
          fi

      - name: Android device smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK=rashody-android/app/build/outputs/apk/debug/app-debug.apk
            PKG=kg.evgeny.moidengi.sheets
            adb install -r "$APK"
            adb shell settings put system accelerometer_rotation 0
            adb shell cmd window user-rotation lock 0
            adb shell am start -W -n "$PKG/kg.evgeny.moidengi.MainActivity"
            sleep 12
            PID="$(adb shell pidof "$PKG" | tr -d '\r')"
            test -n "$PID"
            adb exec-out screencap -p > /tmp/moi-dengi-portrait.png
            adb shell cmd window user-rotation lock 1
            sleep 8
            test "$(adb shell pidof "$PKG" | tr -d '\r')" = "$PID"
            adb exec-out screencap -p > /tmp/moi-dengi-landscape.png
            adb shell cmd window user-rotation lock 0
            sleep 6
            test "$(adb shell pidof "$PKG" | tr -d '\r')" = "$PID"
            adb exec-out screencap -p > /tmp/moi-dengi-portrait-again.png
            python3 -m pip install --quiet Pillow
            python3 - <<'PY'
            from PIL import Image
            names=['portrait','landscape','portrait-again']
            shapes=[]
            for name in names:
              im=Image.open('/tmp/moi-dengi-'+name+'.png').convert('RGB')
              w,h=im.size
              pix=im.load()
              # A genuine finance home screen contains the dark green hero card.
              # A fully blank WebView, or a white Google error, fails this test.
              sampled=0
              dark=0
              for y in range(0,h,8):
                for x in range(0,w,8):
                  r,g,b=pix[x,y]
                  sampled+=1
                  if r<95 and g<140 and b<110:dark+=1
              ratio=dark/sampled
              print(name,(w,h),'dark-ratio=',round(ratio,4),flush=True)
              if ratio<0.035:
                raise AssertionError(name+' screenshot is blank or missing finance UI')
              shapes.append((w,h))
            assert shapes[0][1]>shapes[0][0], 'Expected portrait startup'
            assert shapes[1][0]>shapes[1][1], 'Android did not rotate to landscape'
            assert shapes[2][1]>shapes[2][0], 'Android did not return to portrait'
            print('Rotation, layout and renderer process smoke tests passed')
            PY
            adb shell dumpsys meminfo "$PKG" | head -55
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION.*kg.evgeny.moidengi|crash.*kg.evgeny.moidengi'; then
              echo 'Finance app crash detected'
              exit 1
            fi

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoiDengi-Android-APK
          path: rashody-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct APK download
        run: |
          set -euo pipefail
          # Keep the built APK outside the working tree while checking out
          # the newest branch HEAD. This avoids binary rebase conflicts.
          cp rashody-android/app/build/outputs/apk/debug/app-debug.apk /tmp/moi-dengi.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p rashody-android/downloads
            cp /tmp/moi-dengi.apk rashody-android/downloads/moi-dengi.apk
            git add -f rashody-android/downloads/moi-dengi.apk
            if git diff --cached --quiet; then
              echo "APK is already current"
              exit 0
            fi
            git commit -m "chore: publish Moi Dengi APK [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Could not publish APK without racing other commits" >&2
          exit 1

