plugins {
    id 'com.android.application'
}

android {
    namespace 'kg.evgeny.moidengi'
    compileSdk 35

    defaultConfig {
        applicationId 'kg.evgeny.moidengi.sheets.next'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.2.0'
    }

    buildTypes {
        // Disallow WebView remote debugging and Android debug capabilities
        // even for this internally distributed build.
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
